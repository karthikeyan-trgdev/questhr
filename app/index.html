<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>

<body>
  <title>QuestHR Command</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* Layout: a night-sky command band (crescent mark, org, live status, grouped navigation) over a calm working pane; side panel for the AI assistant; modals for detail, preview, studio and the completion dance */
    :root {
      --bg: #eef0f5;
      --surface: #ffffff;
      --sunk: #f6f7fa;
      --ink: #121a2e;
      --muted: #5a6378;
      --line: #d8dce6;
      --accent: #1d3f8f;
      --accent-ink: #ffffff;
      --xp: #b07f22;
      --xp-soft: #f8eed6;
      --band: #0f1a33;
      --band2: #18264a;
      --band-ink: #f2eee2;
      --band-muted: #a9b2c9;
      --ok: #17803d;
      --warn: #b45309;
      --bad: #c2381a;
      --ok-soft: #e3f4e8;
      --bad-soft: #fbe7e1;
      --lv0: #8a3a14;
      --lv1: #1d3f8f;
      --lv2: #0d7480;
      --lv3: #6b4fae;
      --lv4: #4d7c0f;
      --r-admin: #4a5568;
      --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
      --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --shadow: 0 1px 2px rgba(18, 26, 46, .06), 0 6px 18px rgba(18, 26, 46, .07);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0f1d;
        --surface: #131a2c;
        --sunk: #0f1526;
        --ink: #e7eaf2;
        --muted: #9aa3b8;
        --line: #26304a;
        --accent: #86a6ff;
        --accent-ink: #0a0f1d;
        --xp: #e6bb62;
        --xp-soft: #3a2d12;
        --band: #060b17;
        --band2: #0f1830;
        --band-ink: #f2eee2;
        --band-muted: #94a0bd;
        --ok: #4ccf7a;
        --warn: #f0a43a;
        --bad: #ff7a59;
        --ok-soft: #14301f;
        --bad-soft: #3a1d16;
        --lv0: #d0693a;
        --lv1: #86a6ff;
        --lv2: #2fa6b2;
        --lv3: #9b84e0;
        --lv4: #86b83a;
        --r-admin: #7c8799;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .3);
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0a0f1d;
      --surface: #131a2c;
      --sunk: #0f1526;
      --ink: #e7eaf2;
      --muted: #9aa3b8;
      --line: #26304a;
      --accent: #86a6ff;
      --accent-ink: #0a0f1d;
      --xp: #e6bb62;
      --xp-soft: #3a2d12;
      --band: #060b17;
      --band2: #0f1830;
      --band-ink: #f2eee2;
      --band-muted: #94a0bd;
      --ok: #4ccf7a;
      --warn: #f0a43a;
      --bad: #ff7a59;
      --ok-soft: #14301f;
      --bad-soft: #3a1d16;
      --lv0: #d0693a;
      --lv1: #86a6ff;
      --lv2: #2fa6b2;
      --lv3: #9b84e0;
      --lv4: #86b83a;
      --r-admin: #7c8799;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .3);
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 14px;
      line-height: 1.5
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--band)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--xp);
      outline-offset: 2px
    }

    .vh {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px))
    }

    .top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: linear-gradient(180deg, var(--band), var(--band2));
      color: var(--band-ink);
      box-shadow: 0 2px 14px rgba(6, 11, 23, .25)
    }

    .top .wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      padding-block: 10px
    }

    .brand {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .03em;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
      min-width: 0
    }

    .brand small {
      display: block;
      font-family: var(--f-mono);
      font-size: 10.5px;
      font-weight: 400;
      color: var(--band-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 46vw
    }

    .mark {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 50%;
      box-shadow: inset 8px -4px 0 0 var(--xp);
      position: relative
    }

    .mark::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 5px;
      height: 5px;
      background: var(--xp);
      transform: rotate(45deg)
    }

    .mark.lg {
      width: 54px;
      height: 54px;
      box-shadow: inset 14px -7px 0 0 var(--xp)
    }

    .mark.lg::after {
      width: 8px;
      height: 8px;
      right: -5px;
      top: 4px
    }

    .orglogo {
      height: 34px;
      max-width: 90px;
      object-fit: contain;
      border-radius: 6px;
      background: #fff;
      padding: 2px
    }

    .orglogo.lg {
      height: 60px;
      max-width: 160px
    }

    .acct {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      flex-wrap: wrap
    }

    .acct .muted {
      color: var(--band-muted)
    }

    .top .btn {
      background: transparent;
      border-color: rgba(242, 238, 226, .25);
      color: var(--band-ink)
    }

    .top .btn:hover {
      border-color: var(--xp)
    }

    .sync {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid rgba(242, 238, 226, .25);
      white-space: nowrap
    }

    .sync i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7c8799
    }

    .sync.live i {
      background: #4ccf7a;
      box-shadow: 0 0 0 3px rgba(76, 207, 122, .25)
    }

    .sync.saving i {
      background: #e6bb62
    }

    .sync.ro i,
    .sync.err i {
      background: #ff7a59
    }

    .nav {
      display: flex;
      gap: 4px 14px;
      overflow-x: auto;
      padding-block: 2px 10px;
      align-items: center
    }

    .nav .grp {
      display: flex;
      gap: 2px;
      align-items: center;
      flex: none
    }

    .nav .gl {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--band-muted);
      margin-right: 4px
    }

    .tab {
      background: none;
      border: 0;
      padding: 7px 11px;
      border-radius: 6px;
      color: var(--band-muted);
      font-weight: 500;
      white-space: nowrap
    }

    .tab:hover {
      color: var(--band-ink)
    }

    .tab[aria-selected=true] {
      background: var(--xp);
      color: #1c1405
    }

    .tab .n {
      font-family: var(--f-mono);
      font-size: 11px;
      background: var(--bad);
      color: #fff;
      border-radius: 9px;
      padding: 0 6px;
      margin-left: 6px
    }

    main {
      padding-block: 18px 90px
    }

    h1,
    h2,
    h3 {
      font-family: var(--f-display);
      margin: 0;
      text-wrap: balance;
      letter-spacing: .01em
    }

    h1 {
      font-size: 30px
    }

    h2 {
      font-size: 22px
    }

    h3 {
      font-size: 16px
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 12px
    }

    .mono {
      font-family: var(--f-mono);
      font-variant-numeric: tabular-nums
    }

    select,
    input[type=text],
    input[type=password],
    input[type=date],
    input[type=time],
    input[type=search],
    input[type=number],
    textarea {
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      max-width: 100%;
      min-width: 0
    }

    input[type=file] {
      max-width: 100%
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent)
    }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 64px
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 7px 12px;
      font-weight: 500;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center
    }

    .btn:hover {
      border-color: var(--accent)
    }

    .btn.pri {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    .btn.ok {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .btn.gold {
      background: var(--xp);
      border-color: var(--xp);
      color: #1c1405
    }

    .btn.ai {
      border-color: var(--xp);
      color: var(--ink)
    }

    .btn.ai::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--xp);
      transform: rotate(45deg)
    }

    .btn.ghost {
      background: none
    }

    .btn.sm {
      padding: 3px 9px;
      font-size: 12px
    }

    .btn.danger {
      color: var(--bad)
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 500;
      text-align: left
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center
    }

    .between {
      justify-content: space-between
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      min-width: 0
    }

    .stack {
      display: grid;
      gap: 14px
    }

    .me {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px
    }

    .xpbar {
      height: 8px;
      background: var(--xp-soft);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
      max-width: 340px
    }

    .xpbar span {
      display: block;
      height: 100%;
      background: var(--xp)
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center
    }

    .stat b {
      display: block;
      font-family: var(--f-display);
      font-size: 22px;
      line-height: 1.1
    }

    .stat span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted)
    }

    @media (max-width:720px) {
      .me {
        grid-template-columns: auto 1fr
      }

      .me .stats {
        grid-column: 1/-1
      }
    }

    .emb {
      --c: var(--lv2);
      width: 38px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--c);
      color: #fff;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 13px;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      overflow: hidden
    }

    .emb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 14%;
      display: block;
      transform: scale(1.5);
      transform-origin: 50% 20%
    }

    .emb.sm {
      width: 26px;
      height: 29px;
      font-size: 9px
    }

    .portrait {
      --c: var(--lv2);
      width: 86px;
      height: 108px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--c);
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 24px;
      position: relative
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .portrait button {
      position: absolute;
      inset: auto 0 0 0;
      border: 0;
      background: rgba(10, 14, 22, .62);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 0
    }

    .pips {
      display: inline-flex;
      gap: 3px;
      vertical-align: middle
    }

    .pips i {
      width: 6px;
      height: 6px;
      background: var(--xp);
      transform: rotate(45deg)
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 2px 7px;
      background: var(--sunk);
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap
    }

    .chip.high,
    .chip.missed,
    .chip.returned,
    .chip.rejected {
      color: var(--bad);
      border-color: currentColor
    }

    .chip.med,
    .chip.partial,
    .chip.pending,
    .chip.signoff {
      color: var(--warn);
      border-color: currentColor
    }

    .chip.achieved,
    .chip.verified,
    .chip.done,
    .chip.approved {
      color: var(--ok);
      border-color: currentColor
    }

    .chip.late {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad)
    }

    .chip.bonus {
      background: var(--xp);
      color: #1c1405;
      border-color: var(--xp)
    }

    .chip.help {
      color: var(--accent);
      border-color: currentColor
    }

    .chip.role {
      color: var(--c);
      border-color: var(--c)
    }

    .chip.ind {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 500
    }

    .fchip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--f-mono);
      font-size: 12px;
      background: var(--xp-soft);
      color: var(--ink);
      border: 0;
      padding: 2px 8px;
      border-radius: 4px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .fchip b {
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--xp)
    }

    .fchip:hover {
      outline: 1px solid var(--xp)
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      flex-wrap: wrap
    }

    .seg button {
      border: 0;
      background: var(--surface);
      padding: 6px 12px;
      color: var(--muted)
    }

    .seg button[aria-pressed=true] {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px
    }

    @media (max-width:980px) {
      .board {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media (max-width:560px) {
      .board {
        grid-template-columns: 1fr
      }
    }

    .col {
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      min-width: 0
    }

    .col h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 4px 10px
    }

    .cards {
      display: grid;
      gap: 8px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      text-align: left;
      width: 100%;
      display: grid;
      gap: 8px;
      box-shadow: var(--shadow)
    }

    .card:hover {
      border-color: var(--accent)
    }

    .card .t {
      font-weight: 600;
      line-height: 1.3
    }

    .card .m {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted)
    }

    .empty {
      font-size: 13px;
      color: var(--muted);
      padding: 10px 4px
    }

    .tree ul {
      list-style: none;
      margin: 0;
      padding-left: 26px;
      border-left: 1px dashed var(--line);
      margin-left: 18px
    }

    .tree>ul {
      border: 0;
      padding: 0;
      margin: 0
    }

    .node {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 0;
      flex-wrap: wrap
    }

    .minibar {
      width: 120px;
      height: 6px;
      background: var(--xp-soft);
      border-radius: 3px;
      overflow: hidden
    }

    .minibar span {
      display: block;
      height: 100%;
      background: var(--xp)
    }

    .meter {
      height: 8px;
      background: var(--sunk);
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden
    }

    .meter span {
      display: block;
      height: 100%;
      background: var(--ok)
    }

    .meter.warn span {
      background: var(--warn)
    }

    .meter.bad span {
      background: var(--bad)
    }

    .tw {
      overflow-x: auto;
      min-width: 0
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap
    }

    td.c,
    th.c {
      text-align: center
    }

    td.r,
    th.r {
      text-align: right
    }

    .yes {
      color: var(--ok);
      font-weight: 700
    }

    .no {
      color: var(--muted)
    }

    .feed {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid
    }

    .feed li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .feed time {
      font-size: 12px;
      color: var(--muted)
    }

    .g2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    .g3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px
    }

    .g4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px
    }

    .g5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px
    }

    @media (max-width:900px) {

      .g3,
      .g2 {
        grid-template-columns: 1fr
      }

      .g4,
      .g5 {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    .ai-h {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px
    }

    .ai-h::before {

    .stage {

      border: 1px solid var(--line);

      display: grid;
      gap: 8px;
      justify-items: center;
      overflow: hidden
    }

    .dancer {
      position: relative;
      width: 200px;
      height: 250px;
      animation: sway .9s ease-in-out infinite alternate;
      transform-origin: 50% 100%
    }

    .dancer img {
      position: absolute;
      left: 0;
      top: 0;
      width: 200px;
      height: 250px
    }

    .dancer .head {
      animation: bob .45s ease-in-out infinite alternate;
      transform-origin: 100px 150px
    }

    .arm {
      position: absolute;
      top: 186px;
      width: 20px;
      height: 66px;
      background: var(--sleeve);
      border-radius: 10px;
      transform-origin: 10px 8px
    }

    .arm i {
      position: absolute;
      bottom: -9px;
      left: 1px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--skin)
    }

    .arm.l {
      left: 20px;
      animation: waveL .45s ease-in-out infinite alternate
    }

    .arm.r {
      left: 160px;
      animation: waveR .45s ease-in-out infinite alternate
    }

      inset: 0;

      height: 12px;
      border-radius: 2px;

    @keyframes sway {
      from {
        transform: rotate(-6deg) translateY(0)

      to {
        transform: rotate(6deg) translateY(-14px)
      }
    }

    @keyframes bob {
      from {
        transform: rotate(-9deg)
      }

      to {
        transform: rotate(9deg)
      }
    }

    @keyframes waveL {
      from {
        transform: rotate(25deg)
      }

      to {
        transform: rotate(165deg)
      }
    }

    @keyframes waveR {
      from {
        transform: rotate(-25deg)
      }

      to {
        transform: rotate(-165deg)
      }
    }

    @keyframes fall {
      to {
        transform: translateY(560px) rotate(540deg)
      }
    }
